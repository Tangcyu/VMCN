[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorq"
version = "0.1.0"
description = "Shared TensorQ package for next-hit and pair-wise committors."
requires-python = ">=3.10"
dependencies = [
  "matplotlib",
  "numpy",
  "pandas",
  "pyyaml",
  "scikit-learn",
  "scipy",
  "torch",
  "tqdm",
]

[project.optional-dependencies]
label = [
  "MDAnalysis",
]
structures = ["mdtraj"]
pcca = ["deeptime"]
test = ["pytest>=7"]
all = [
  "MDAnalysis",
  "deeptime",
  "mdtraj",
]

[project.scripts]
tensorq-label = "tensorq.next_hit.label:main"
tensorq-next-hit-train = "tensorq.next_hit.train:main"
tensorq-next-hit-infer = "tensorq.next_hit.infer:main"
tensorq-next-hit-plot = "tensorq.next_hit.plot:main"
tensorq-next-hit-rate = "tensorq.next_hit.rate_constant:main"
tensorq-next-hit-fit-rate = "tensorq.next_hit.fit_rate:main"
tensorq-gradpath = "tensorq.gradpath.runner:main"
tensorq-gradpath-plot = "tensorq.gradpath.plot_runner:main"
tensorq-gradpath-mergy = "tensorq.voronoi_merge.runner:main"
tensorq-voronoi-merge = "tensorq.voronoi_merge.runner:main"
tensorq-pairwise-train = "tensorq.pairwise.train:main"
tensorq-pairwise-infer = "tensorq.pairwise.infer:main"
tensorq-pairwise-plot = "tensorq.pairwise.plot:main"
tensorq-pairwise-rate = "tensorq.pairwise.rate_constant:main"
tensorq-msmlabel = "tensorq.MSMlabel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tensorq.MSMlabel" = ["README.md", "config.template.yaml"]
