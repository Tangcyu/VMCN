# ============================================================
# TensorQ Relabel
# ============================================================
#
# Usage:
#   python scripts/relabel_diagnose.py --config configs/relabel.example.yaml
#   python scripts/relabel.py          --config configs/relabel.example.yaml
#
# Current outputs:
#   diagnose -> diagnostic_summary.yaml
#   relabel  -> relabel_summary.yaml
#   relabel  -> optional relabeled dataset
#   relabel  -> optional diagnostic plots
#
# Automatic relabeling follows:
#   entropy -> density -> kinetics

RELABEL:
  # ---- Required inputs ----
  # Dataset produced by TENSORQ_LABEL / next_hit label.
  dataset: "./dataset_out/dataset.pt"

  # Trained next-hit committor-vector checkpoint.
  model: "./next_hit_train/next_hit_committor_best_checkpoint.pt"

  # ---- Output ----
  output_dir: "./relabel"

  # ---- Device and inference ----
  device: "cuda:0"
  batch_size: 65536
  dataset_stride: 1
  n_states: null

  # ---- Model input selection ----
  # "features" uses dataset features directly; "cv" rebuilds model inputs from
  # selected CV columns.
  model_input_space: "features"
  cvs_to_use: []
  periodic_cvs: false
  periodic_cv_units: "degrees"

  # ---- Shared diagnose/relabel decisions ----
  analysis:
    lag_list: [1, 2, 5, 10, 20]
    q_cutoff: 0.7
    entropy_cutoff: 0.5
    lagged_entropy_cutoff: 0.5
    lagged_qmax_cutoff: 0.7
    core_cutoff: 0.8
    min_count: 50
    persistent_fraction: 0.5
    eigengap: 0.05
    max_groups: 6
    min_group_size: 50
    min_slow_eigenvalue: 0.8
    random_seed: 0

  # ---- Diagnostics ----
  # Diagnostics writes only diagnostic_summary.yaml.
  diagnostics:
    compute_lagged_entropy: true
    compute_basin_kinetic_groups: true
    profile_timing: true

  # ---- Relabeling ----
  # Relabeling writes relabel_summary.yaml and, if enabled below, a relabeled
  # dataset. It does not write per-frame CSV dumps.
  relabel:
    write_relabel_dataset: true
    output_dataset: "./relabel/relabeled_dataset.pt"
    compact_labels: true
    make_plots: true

    # Entropy stage, state-level pruning.
    # A whole state is removed when most frames are low-consistency or
    # high-entropy, or when too little stable high-confidence core remains.
    remove_inconsistent_states: true
    remove_problem_fraction_cutoff: 0.9
    remove_min_stable_fraction: 0.5

    # Entropy stage, frame-level candidates.
    candidate_require_current_low_qmax: false
    candidate_current_qmax_cutoff: 0.7
    candidate_lag_list: [1, 2, 5, 10, 20]
    candidate_lagged_entropy_min_valid_lags: 1
    candidate_no_valid_lag_policy: "review"

    # Candidate clustering stage. Persistent high-lagged-entropy candidates are
    # split by slow kinetic modes first, then each kinetic component is trimmed
    # to a weighted local-density core. Set candidate_kinetic_clustering_enabled
    # false to fall back to the old feature-space kNN connected components.
    promote_missing_metastate_candidates: true
    graph_space: "auto"
    max_graph_frames: 20000
    k_neighbors: 20
    candidate_graph_mode: "mutual_knn"
    candidate_cluster_core_fraction: 1.0
    min_new_core_size: 100
    min_new_core_weight: 0.0

    # Kinetic clustering for missing-state candidates.
    # For slow systems, make these lags comparable to the slow process; too
    # short a lag can merge or cut basins based on fast local motion.
    candidate_kinetic_clustering_enabled: true
    candidate_kinetic_lag_list: null
    candidate_kinetic_analysis_lag: null
    candidate_kinetic_min_valid_pairs: 50
    candidate_kinetic_min_microstates: 6
    candidate_kinetic_max_microstates: 50
    candidate_kinetic_target_frames_per_microstate: 200
    candidate_kinetic_min_frames_per_microstate: 20
    candidate_kinetic_max_core_frames: 20000
    candidate_kinetic_microstate_batch_size: 8192
    candidate_kinetic_microstate_n_init: 2
    candidate_kinetic_macrostate_n_init: 5
    candidate_kinetic_min_macro_groups: 1
    candidate_kinetic_max_macro_groups: 6
    candidate_kinetic_min_slow_eigenvalue: null
    candidate_kinetic_min_eigengap: null
    candidate_kinetic_strong_eigengap: 0.12
    candidate_kinetic_split_on_slow_mode_without_eigengap: true
    candidate_kinetic_max_transition_pairs: 0
    candidate_kinetic_fallback_to_knn: true
    candidate_kinetic_n_groups: null
    candidate_kinetic_allow_final_split: false
    # Core selection for kinetic missing-state candidates.
    # "slow" trims each proposed new core by density in the slow spectral
    # embedding of the candidate microstate transition matrix. "graph" keeps
    # the old behavior, where final density trimming uses graph_space features.
    candidate_core_space: "slow"      # slow | graph
    candidate_slow_core_max_dims: null

    # Density core selection after candidate clustering.
    density_core_enabled: true
    density_core_fraction: 0.5
    density_core_min_weight: 0.0
    density_core_max_size: null

    # Kinetics stage, new-label merge.
    merge_mixed_new_states: true
    merge_lag_list: [1, 2, 5, 10, 20]
    merge_min_valid_pairs: 50
    merge_transition_cutoff: 0.05
    merge_require_bidirectional: true
    merge_max_iterations: 100

    # Kinetics stage, existing-label reshape/split.
    reshape_existing_basins: true
    trim_existing_to_high_confidence_core: true
    split_existing_kinetic_groups: true
    min_kinetic_groups_to_split: 2
    min_split_core_weight_fraction: 0.1

    # Kinetics stage, final consistency checks.
    final_kinetic_check_enabled: true
    final_check_lag_list: [1, 2, 5, 10, 20]
    final_check_merge_enabled: true
    final_check_merge_new_existing: true
    final_check_merge_new_new: true
    final_check_merge_all_labels: false
    final_check_merge_max_iterations: 100
    final_check_split_enabled: true
    # Existing labels are already handled by basin_kinetic_groups. Checking
    # only new labels avoids a second large all-label kNN pass.
    final_check_split_labels: "new"
    final_check_split_k_neighbors: 20
    final_check_split_min_component_size: 100
    final_check_split_min_component_weight: 0.0
    final_check_split_min_components: 2
    final_check_split_max_label_frames: 200000
    final_check_split_require_low_exchange: true
    final_check_split_max_exchange_probability: 0.05
    final_check_split_min_component_valid_pairs: 1
    final_check_report_unsplit_labels: false
    final_check_split_knn_backend: "torch"
    final_check_split_knn_device: "cuda:0"
    final_check_split_torch_knn_query_batch: 4096
    final_check_split_torch_knn_reference_batch: 32768
    final_check_split_torch_knn_dtype: "float32"

    # kNN backend. auto uses Torch/CUDA below size limits and sklearn fallback.
    random_seed: 0
    knn_backend: "auto"      # auto | torch | cuda | sklearn
    knn_device: "cuda:0"
    torch_knn_auto_max_pairs: 1000000000
    torch_knn_query_batch: 4096
    torch_knn_reference_batch: 32768
    torch_knn_dtype: "float32"

    # Optional relabel diagnostic plots:
    # - current entropy
    # - time-lagged entropy
    # - selected candidates
    # - labels before/after relabeling
    plotting:
      dir: "plots"
      format: "png"
      space: "cv"          # cv | features
      plane: []            # empty chooses first two dimensions
      max_points: 20000
      max_label_points: 100000

  # ---- Existing-basin kinetic grouping ----
  basin_kinetic_groups:
    enabled: true
    lag_list: [1, 2, 5, 10, 20]
    analysis_lag: null
    q_core_cutoff: 0.8
    q_core_mode: "own_high"
    require_q_argmax: true
    min_group_size: 50
    min_group_weight: 0.0
    min_valid_pairs: 50
    min_microstates: 8
    max_microstates: 100
    target_frames_per_microstate: 500
    min_frames_per_microstate: 20
    max_core_frames: 200000
    microstate_batch_size: 8192
    microstate_n_init: 5
    macrostate_n_init: 10
    cache_state_pair_positions: true
    # Set to a positive value to sample lagged transition pairs per state/lag.
    # 0 keeps exact transition counts.
    max_transition_pairs_per_state_lag: 0
    min_macro_groups: 1
    max_macro_groups: 6
    min_slow_eigenvalue: 0.8
    min_eigengap: 0.05
    strong_eigengap: 0.12
    split_on_slow_mode_without_eigengap: true
    random_seed: 0
