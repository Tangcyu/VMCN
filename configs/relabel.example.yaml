# ============================================================
# TensorQ Relabel — State-Label Confidence Diagnostics
# ============================================================
#
# Usage:
#   python scripts/relabel_diagnose.py --config configs/relabel.example.yaml
#   python scripts/relabel.py  --config configs/relabel.example.yaml
#
# This runs post-training diagnostics on a trained committor-vector
# model to evaluate whether current state labels are reliable.
# It detects split candidates, merge candidates, and missing-state
# candidates, and generates diagnostic plots in CV space.

RELABEL:
  # ---- Required inputs ----
  # Dataset produced by TENSORQ_LABEL (dataset.pt or dataset.npz).
  dataset: "./dataset_out/dataset.pt"
  dataset_path: "./dataset_out/dataset.pt"   # alias

  # Trained model checkpoint (TorchScript or next_hit best_checkpoint.pt).
  model: "./next_hit_train/next_hit_committor_best_checkpoint.pt"

  # ---- Output ----
  output_dir: "./relabel"
  out_dir: "./relabel"                       # alias

  # ---- Device and inference ----
  device: "cuda:0"
  batch_size: 65536
  dataset_stride: 1

  # Optional explicit state count (null infers from dataset metadata).
  n_states: null

  # Model input-space options when model is a checkpoint.
  model_input_space: "features"              # "features" or "cv"
  cvs_to_use: []
  periodic_cvs: false
  periodic_cv_units: "degrees"

  # ---- Shared diagnose/relabel decisions ----
  # These are the main knobs. Older confidence/kinetics/uncertainty keys still
  # work as compatibility fallbacks, but new configs should start here.
  analysis:
    lag_list: [1, 2, 5, 10, 20]
    q_cutoff: 0.7              # committed if q_max >= q_cutoff.
    entropy_cutoff: 0.5        # uncertain if H_norm >= entropy_cutoff.
    lagged_entropy_cutoff: 0.5 # high H_tau if H_norm(x_{t+tau}) >= this.
    lagged_qmax_cutoff: 0.7    # retained for diagnostics/backward-compatible summaries.
    core_cutoff: 0.8           # high-confidence core for splitting existing labels.
    min_count: 50              # minimum lagged-pair/group support.
    persistent_fraction: 0.5   # persistent uncertain frames are missing-state review candidates.
    eigengap: 0.05             # local spectral-MSM split threshold.
    max_groups: 6
    min_group_size: 50
    min_slow_eigenvalue: 0.8
    random_seed: 0

  # ---- Diagnostics ----
  diagnostics:
    compute_lagged_entropy: true
    profile_timing: true

  output:
    save_per_frame_csv: false
    save_per_frame_npz: false
    save_q_values: true

  relabel:
    # Dataset writing and bookkeeping.
    write_relabel_dataset: true
    output_dataset: "./relabel/relabeled_dataset.pt"
    compact_labels: true
    max_review_frames: 20000

    # Existing-label cleanup before adding new labels. Slow-mode split groups
    # smaller than min_new_core_size are dropped to -1 instead of new labels.
    remove_problem_fraction_cutoff: 0.9
    reshape_existing_basins: true

    # H(x) candidate selection uses analysis.entropy_cutoff; H_tau candidate
    # classification uses analysis.lagged_entropy_cutoff.
    candidate_lag_list: [1, 2, 5, 10, 20]

    # Missing-metastate clustering. graph_space:auto follows model_input_space
    # when available; otherwise it uses CVs.
    graph_space: auto
    random_seed: 0
    max_graph_frames: 20000
    k_neighbors: 20
    min_new_core_size: 100
    density_core_fraction: 0.5

    # Merge newly created labels if they exchange strongly at lag time.
    merge_mixed_new_states: true
    merge_lag_list: [1, 2, 5, 10, 20]
    merge_transition_cutoff: 0.05

    # kNN backend. auto uses Torch/CUDA below size limits and sklearn otherwise.
    knn_backend: auto        # auto | torch | cuda | sklearn

    # Relabel plots.
    make_relabel_plots: true
    plot_unlabeled: false

  # ---- Existing-basin kinetic reshaping ----
  basin_kinetic_groups:
    enabled: true
    lag_list: [1, 2, 5, 10, 20]
    analysis_lag: null
    q_core_cutoff: 0.8
    q_core_mode: "own_high"
    require_q_argmax: true
    min_group_size: 50
    min_group_weight: 0.0
    min_valid_pairs: 50
    min_microstates: 8
    max_microstates: 100
    target_frames_per_microstate: 500
    min_frames_per_microstate: 20
    max_core_frames: 200000
    microstate_batch_size: 8192
    microstate_n_init: 5
    min_macro_groups: 1
    max_macro_groups: 6
    min_slow_eigenvalue: 0.8
    min_eigengap: 0.05
    strong_eigengap: 0.12
    # Drop a proposed split group to -1 if its weight fraction among the
    # split groups is below this cutoff, e.g. 0.99/0.01 drops the 0.01 group.
    min_split_core_weight_fraction: 0.1
    split_on_slow_mode_without_eigengap: true
    random_seed: 0

  # ---- Plotting ----
  make_plots: true
  format: "png"

  # CV plane for diagnostic plots (2 or 3 CV column names).
  # Empty uses the first two CV columns found in the dataset.
  planes: []
  cv_plane: []                               # alias

  # Plot appearance.
  max_scatter_points: 20000
  scatter_alpha: 0.35
  scatter_size: 3.0
  histogram_bins: 50
  basin_cmap: "tab10"
  3d_elev: 24.0
  3d_azim: -60.0

  # State naming for plot legends.
  state_names: null
