#############################################################
## JOB DESCRIPTION                                         ##
#############################################################

# This is what this job does


#############################################################
## ADJUSTABLE PARAMETERS                                   ##
#############################################################

structure          carbon.psf
coordinates        carbon.pdb
file mkdir output
outputName         output/TW.unbiased

set temperature    300

# Continuing a job from the restart files
if {0} {
set inputname      carbon_out
binCoordinates     $inputname.restart.coor
binVelocities      $inputname.restart.vel  ;# remove the "temperature" entry if you use this!
extendedSystem	   $inputname.restart.xsc
} 

firsttimestep      0


#############################################################
## SIMULATION PARAMETERS                                   ##
#############################################################

# Input
paraTypeCharmm	    on
parameters          par_all22_prot.inp 

# NOTE: Do not set the initial velocity temperature if you 
# have also specified a .vel restart file!
temperature         $temperature
 

# Periodic Boundary conditions
# NOTE: Do not set the periodic cell basis if you have also 
# specified an .xsc restart file!
if {0} { 
cellBasisVector1    20.0  0    0
cellBasisVector2     0   20.0  0
cellBasisVector3     0    0   50.0
cellOrigin           0    0    0
}
#wrapWater           on
wrapAll             on


# Force-Field Parameters
exclude             scaled1-4
1-4scaling          1.0
cutoff              12.0
switching           on
switchdist          10.0
pairlistdist        14.0


# Integrator Parameters
timestep            0.5  ;# 0.5 fs/step
rigidBonds          all  ;# needed for 2fs steps
nonbondedFreq       1
fullElectFrequency  2  
stepspercycle       10


#PME (for full-system periodic electrostatics)
if {0} {
PME                 yes
PMEGridSpacing      1.0

#manual grid definition
#PMEGridSizeX        32
#PMEGridSizeY        32
#PMEGridSizeZ        64
}


# Constant Temperature Control
langevin            on    ;# do langevin dynamics
langevinDamping     100     ;# damping coefficient (gamma) of 1/ps
langevinTemp        $temperature
langevinHydrogen    no    ;# don't couple langevin bath to hydrogens


# Constant Pressure Control (variable volume)
if {0} {
useGroupPressure      yes ;# needed for 2fs steps
useFlexibleCell       no  ;# no for water box, yes for membrane
useConstantArea       no  ;# no for water box, yes for membrane

langevinPiston        on
langevinPistonTarget  1.01325 ;#  in bar -> 1 atm
langevinPistonPeriod  100.0
langevinPistonDecay   50.0
langevinPistonTemp    $temperature
}


restartfreq         100     ;# 500steps = every 1ps
dcdfreq             100
xstFreq             100
outputEnergies      100
outputPressure      100


# Fixed Atoms Constraint (set PDB beta-column to 1)
if {0} {
fixedAtoms          on
fixedAtomsFile      myfixedatoms.pdb
fixedAtomsCol       B
}


# IMD Settings (can view sim in VMD)
if {0} {
IMDon           on
IMDport         3000    ;# port number (enter it in VMD)
IMDfreq         1       ;# send every 1 frame
IMDwait         no      ;# wait for VMD to connect before running?
}


#############################################################
## EXTRA PARAMETERS                                        ##
#############################################################

# Put here any custom parameters that are specific to 
# this job (e.g., SMD, TclForces, etc...)

tclforces on

tclForcesScript {
  # Constants for the potential
  set m_alpha 1.0

  # Add atoms to be considered
  addatom 1

  proc calcforces {} {
      global m_alpha

      loadcoords p

      set posx [lindex $p(1) 0]
      set posy [lindex $p(1) 1]

      # ============================================================
      # Three-well potential parameters
      #
      # Basin centers:
      #   left   : (-1.5, 0)
      #   middle : ( 0.0, 0)
      #   right  : ( 1.5, 0)
      # ============================================================

      # Depth of each well
      # Larger values make the basins deeper.
      set well_depth_left   6.0
      set well_depth_middle 6.0
      set well_depth_right  6.0

      # Width of each Gaussian well
      #
      # Smaller sigma_x gives narrower wells and higher barriers
      # between neighboring basins.
      #
      # Larger sigma_x makes wells overlap more and lowers barriers.
      set sigma_x 0.55
      set sigma_y 0.65

      # Confinement terms
      #
      # These prevent the particle from escaping to large |x| or |y|.
      set x_confinement 0.15
      set y_confinement 0.30

      # Basin centers
      set x_left   -1.5
      set x_middle  0.0
      set x_right   1.5
      set y_center  0.0

      # Useful squared widths
      set sx2 [expr {$sigma_x * $sigma_x}]
      set sy2 [expr {$sigma_y * $sigma_y}]

      # ============================================================
      # Potential terms
      # ============================================================

      # Left well
      set dx_left [expr {$posx - $x_left}]
      set dy_left [expr {$posy - $y_center}]

      set tmp_left [expr {
          -$well_depth_left
          * exp(
              -($dx_left*$dx_left) / $sx2
              -($dy_left*$dy_left) / $sy2
          )
      }]

      # Middle well
      set dx_middle [expr {$posx - $x_middle}]
      set dy_middle [expr {$posy - $y_center}]

      set tmp_middle [expr {
          -$well_depth_middle
          * exp(
              -($dx_middle*$dx_middle) / $sx2
              -($dy_middle*$dy_middle) / $sy2
          )
      }]

      # Right well
      set dx_right [expr {$posx - $x_right}]
      set dy_right [expr {$posy - $y_center}]

      set tmp_right [expr {
          -$well_depth_right
          * exp(
              -($dx_right*$dx_right) / $sx2
              -($dy_right*$dy_right) / $sy2
          )
      }]

      # Confinement terms
      set tmp_x_conf [expr {
          $x_confinement * $posx*$posx*$posx*$posx
      }]

      set tmp_y_conf [expr {
          $y_confinement * $posy*$posy*$posy*$posy
      }]

      # Total potential
      set potential [expr {
          $tmp_left + $tmp_middle + $tmp_right
          + $tmp_x_conf + $tmp_y_conf
      }]

      # ============================================================
      # Gradients
      #
      # For a Gaussian well:
      #
      # V_i = -D exp[-(x-x_i)^2/sx2 - (y-y_i)^2/sy2]
      #
      # dV_i/dx = V_i * [ -2 (x-x_i) / sx2 ]
      # dV_i/dy = V_i * [ -2 (y-y_i) / sy2 ]
      # ============================================================

      # Gradients of left well
      set dtmp_left_dx [expr {
          $tmp_left * (-2.0 * $dx_left / $sx2)
      }]

      set dtmp_left_dy [expr {
          $tmp_left * (-2.0 * $dy_left / $sy2)
      }]

      # Gradients of middle well
      set dtmp_middle_dx [expr {
          $tmp_middle * (-2.0 * $dx_middle / $sx2)
      }]

      set dtmp_middle_dy [expr {
          $tmp_middle * (-2.0 * $dy_middle / $sy2)
      }]

      # Gradients of right well
      set dtmp_right_dx [expr {
          $tmp_right * (-2.0 * $dx_right / $sx2)
      }]

      set dtmp_right_dy [expr {
          $tmp_right * (-2.0 * $dy_right / $sy2)
      }]

      # Gradients of confinement terms
      set dtmp_x_conf_dx [expr {
          4.0 * $x_confinement * $posx*$posx*$posx
      }]
      set dtmp_x_conf_dy 0.0

      set dtmp_y_conf_dx 0.0
      set dtmp_y_conf_dy [expr {
          4.0 * $y_confinement * $posy*$posy*$posy
      }]

      # Total gradient
      set grad_x [expr {
          $dtmp_left_dx + $dtmp_middle_dx + $dtmp_right_dx
          + $dtmp_x_conf_dx + $dtmp_y_conf_dx
      }]

      set grad_y [expr {
          $dtmp_left_dy + $dtmp_middle_dy + $dtmp_right_dy
          + $dtmp_x_conf_dy + $dtmp_y_conf_dy
      }]

      # Force = -grad V
      set force [list [expr {-$grad_x}] [expr {-$grad_y}] 0.0]

      addforce 1 $force
  }
}

colvars	on
colvarsConfig          colvars.in 


# Minimization
if {0} {
minimize            100
reinitvels          $temperature
}

run 100000000 ; #50ns
