# Chignolin

# A: 0.Inputs/0.Unbiased.A/RES.A.coor and RES.A.vel.
# B: 0.Inputs/output_min_eq/result.coor and result.vel.
# The .coor files are already PDB formatted; both states share the same box.
set stateName       B

# Variables
file mkdir output
set outName         output/Unbiased.${stateName}

# Use amber ff
parmfile            chig.parm7
coordinates         ${stateName}.pdb
extendedSystem      ${stateName}.xsc
velocities          ${stateName}.vel
# temperature         300.0

## SIMULATION PARAMETERS                                  
# AMBER FF settings
amber               on
rigidBonds          all
useSettle           on
rigidTolerance      1.0e-8
rigidIterations     100
cutoff              9.0
pairlistdist        11.0
switching           off
exclude             scaled1-4
readexclusions      yes
1-4scaling          0.83333333
scnb                2.0
# zeromomentum        on
ljcorrection        off
watermodel          tip3

# Integrator Parameters 
timestep            2.0 
nonbondedFreq       1 
fullElectFrequency  1 
stepspercycle       10
splitpatch          hydrogen
hgroupcutoff        2.8

# Output
outputenergies          1000
outputPressure          1000
outputtiming            5000
restartfreq             1000000
binaryoutput            no
binaryrestart           yes
outputname              $outName
restartname             $outName
DCDfile                 $outName.dcd
DCDfreq                 100
DCDUnitCell             yes

# CONSTANT-T

langevin                on
langevinTemp            300.0
langevinDamping         10.0

useGroupPressure yes ;# needed for rigidBonds 
useFlexibleCell no 
useConstantArea no

# PME
PME                 on 
PMETolerance        1.0e-6 
PMEInterpOrder      4 
FFTWUseWisdom       no
PMEGridSpacing      1.0

# PBC
# cellBasisVector1 46.64900016784668 0 0
# cellBasisVector2 0 45.4109992980957 0
# cellBasisVector3 0 0 43.79400062561035
# cellOrigin -0.058893270790576935 0.16000285744667053 0.009412217885255814

# COM

commotion               no
wrapAll                 on
# wrapWater               on


# turn on colvars
colvars                 on
colvarsConfig           colvars.in


firsttimestep 0
run 1000000
