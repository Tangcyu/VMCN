#############################################################
## JOB DESCRIPTION                                         ##
#############################################################

# This is what this job does


#############################################################
## ADJUSTABLE PARAMETERS                                   ##
#############################################################

structure          carbon.psf
coordinates        carbon.pdb
file mkdir output
outputName         output/TW.unbiased

set temperature    300

# Continuing a job from the restart files
if {0} {
set inputname      carbon_out
binCoordinates     $inputname.restart.coor
binVelocities      $inputname.restart.vel  ;# remove the "temperature" entry if you use this!
extendedSystem	   $inputname.restart.xsc
} 

firsttimestep      0


#############################################################
## SIMULATION PARAMETERS                                   ##
#############################################################

# Input
paraTypeCharmm	    on
parameters          par_all22_prot.inp 

# NOTE: Do not set the initial velocity temperature if you 
# have also specified a .vel restart file!
temperature         $temperature
 

# Periodic Boundary conditions
# NOTE: Do not set the periodic cell basis if you have also 
# specified an .xsc restart file!
if {0} { 
cellBasisVector1    20.0  0    0
cellBasisVector2     0   20.0  0
cellBasisVector3     0    0   50.0
cellOrigin           0    0    0
}
#wrapWater           on
wrapAll             on


# Force-Field Parameters
exclude             scaled1-4
1-4scaling          1.0
cutoff              12.0
switching           on
switchdist          10.0
pairlistdist        14.0


# Integrator Parameters
timestep            0.5  ;# 0.5 fs/step
rigidBonds          all  ;# needed for 2fs steps
nonbondedFreq       1
fullElectFrequency  2  
stepspercycle       10


#PME (for full-system periodic electrostatics)
if {0} {
PME                 yes
PMEGridSpacing      1.0

#manual grid definition
#PMEGridSizeX        32
#PMEGridSizeY        32
#PMEGridSizeZ        64
}


# Constant Temperature Control
langevin            on    ;# do langevin dynamics
langevinDamping     100     ;# damping coefficient (gamma) of 1/ps
langevinTemp        $temperature
langevinHydrogen    no    ;# don't couple langevin bath to hydrogens


# Constant Pressure Control (variable volume)
if {0} {
useGroupPressure      yes ;# needed for 2fs steps
useFlexibleCell       no  ;# no for water box, yes for membrane
useConstantArea       no  ;# no for water box, yes for membrane

langevinPiston        on
langevinPistonTarget  1.01325 ;#  in bar -> 1 atm
langevinPistonPeriod  100.0
langevinPistonDecay   50.0
langevinPistonTemp    $temperature
}


restartfreq         100     ;# 500steps = every 1ps
dcdfreq             100
xstFreq             100
outputEnergies      100
outputPressure      100


# Fixed Atoms Constraint (set PDB beta-column to 1)
if {0} {
fixedAtoms          on
fixedAtomsFile      myfixedatoms.pdb
fixedAtomsCol       B
}


# IMD Settings (can view sim in VMD)
if {0} {
IMDon           on
IMDport         3000    ;# port number (enter it in VMD)
IMDfreq         1       ;# send every 1 frame
IMDwait         no      ;# wait for VMD to connect before running?
}


#############################################################
## EXTRA PARAMETERS                                        ##
#############################################################

# Put here any custom parameters that are specific to 
# this job (e.g., SMD, TclForces, etc...)

tclforces on

tclForcesScript {
  # Constants for the potential
  set m_alpha 1.0  ;# replace with actual value of m_alpha if known

  # Add atoms to be considered
  addatom 1
  proc calcforces {} {
      global m_alpha
  
      loadcoords p
  
      set posx [lindex $p(1) 0]
      set posy [lindex $p(1) 1]
  
      # Tunable parameters
      #
      # Original value: upper_basin_depth = 3.0
      # Increasing this makes the basin near x = 0, y = 5/3 deeper.
      set upper_basin_depth 5.0
  
      # Original value: well_depth = 5.0
      # This mostly controls the two lower side basins near x = +/-1, y = 0.
      set well_depth 5.0
  
      # Original value: x_confinement = 0.2
      set x_confinement 0.2
  
      # Original value: y_confinement = 0.2
      # Reducing this can also lower high-y regions, but changes vertical confinement.
      set y_confinement 0.2
  
      # Useful constants
      set y_lower [expr {1.0 / 3.0}]
      set y_upper [expr {5.0 / 3.0}]
  
      # Potential terms
      set tmp1 [expr {
          $upper_basin_depth
          * exp(-$posx*$posx)
          * (
              exp(-(($posy - $y_lower)*($posy - $y_lower)) / $m_alpha)
              - exp(-(($posy - $y_upper)*($posy - $y_upper)) / $m_alpha)
          )
      }]
  
      set tmp2 [expr {
          -$well_depth
          * exp(-($posy*$posy) / $m_alpha)
          * (
              exp(-(($posx - 1.0)*($posx - 1.0)))
              + exp(-(($posx + 1.0)*($posx + 1.0)))
          )
      }]
  
      set tmp3 [expr {
          $x_confinement * $posx*$posx*$posx*$posx
      }]
  
      set tmp4 [expr {
          $y_confinement
          * ($posy - $y_lower)*($posy - $y_lower)
          * ($posy - $y_lower)*($posy - $y_lower)
          / ($m_alpha*$m_alpha)
      }]
  
      # Potential
      set potential [expr {$tmp1 + $tmp2 + $tmp3 + $tmp4}]
  
      # Gradients of tmp1
      set dtmp1_dx [expr {
          $tmp1 * -2.0 * $posx
      }]
  
      set dtmp1_dy [expr {
          $upper_basin_depth
          * exp(-$posx*$posx)
          * (
              (-2.0 * ($posy - $y_lower) / $m_alpha)
              * exp(-(($posy - $y_lower)*($posy - $y_lower)) / $m_alpha)
              -
              (-2.0 * ($posy - $y_upper) / $m_alpha)
              * exp(-(($posy - $y_upper)*($posy - $y_upper)) / $m_alpha)
          )
      }]
  
      # Gradients of tmp2
      set dtmp2_dx [expr {
          -$well_depth
          * exp(-($posy*$posy) / $m_alpha)
          * (
              (-2.0 * ($posx - 1.0))
              * exp(-(($posx - 1.0)*($posx - 1.0)))
              +
              (-2.0 * ($posx + 1.0))
              * exp(-(($posx + 1.0)*($posx + 1.0)))
          )
      }]
  
      set dtmp2_dy [expr {
          -$well_depth
          * exp(-($posy*$posy) / $m_alpha)
          * (-2.0 * $posy / $m_alpha)
          * (
              exp(-(($posx - 1.0)*($posx - 1.0)))
              + exp(-(($posx + 1.0)*($posx + 1.0)))
          )
      }]
  
      # Gradients of tmp3
      set dtmp3_dx [expr {
          4.0 * $x_confinement * $posx*$posx*$posx
      }]
      set dtmp3_dy 0.0
  
      # Gradients of tmp4
      set dtmp4_dx 0.0
      set dtmp4_dy [expr {
          4.0 * $y_confinement
          * ($posy - $y_lower)*($posy - $y_lower)*($posy - $y_lower)
          / ($m_alpha*$m_alpha)
      }]
  
      # Total gradient
      set grad_x [expr {
          $dtmp1_dx + $dtmp2_dx + $dtmp3_dx + $dtmp4_dx
      }]
  
      set grad_y [expr {
          $dtmp1_dy + $dtmp2_dy + $dtmp3_dy + $dtmp4_dy
      }]
  
      # Force = -grad V
      set force [list [expr {-$grad_x}] [expr {-$grad_y}] 0.0]
  
      addforce 1 $force
  }

}

colvars	on
colvarsConfig          colvars.in 


# Minimization
if {0} {
minimize            100
reinitvels          $temperature
}

run 100000000 ; #50ns
